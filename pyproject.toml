[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vjor"
version = "3.0.4"
description = "Vjor - Un formato de archivo todo en uno"
readme = "README.md"
authors = [{name = "Lucas Sogaray"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "cryptography",
    "pillow"
]


[project.urls]
"Source Code" = "https://github.com/lucassogarayDA/vjor"
"Documentation" = "https://github.com/lucassogarayDA/vjor#readme"
"Issue Tracker" = "https://github.com/lucassogarayDA/vjor/issues"


[project.scripts]
Vjor = "Vjor:main"

[tool.setuptools]
py-modules = ["Vjor"]
